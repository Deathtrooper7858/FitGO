# ─── FitGO Supabase Configuration ──────────────────────────────────────────
# Referencia completa: https://supabase.com/docs/guides/cli/config

# ─── API Settings ──────────────────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_request_body_size = 2097152  # 2MB

# ─── Database Settings ─────────────────────────────────────────────────────
[db]
migration_directory = "supabase/migrations"

# ─── Auth Settings ─────────────────────────────────────────────────────────
[auth]
enabled = true

# ─── Storage Settings ──────────────────────────────────────────────────────
[storage]
enabled = true

# ─── Edge Functions ────────────────────────────────────────────────────────

[functions.groq-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/groq-proxy/deno.json"
entrypoint = "./functions/groq-proxy/index.ts"

[functions.edamam-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/edamam-proxy/deno.json"
entrypoint = "./functions/edamam-proxy/index.ts"
