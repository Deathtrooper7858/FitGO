name: FitGO CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm run ci:audit
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
